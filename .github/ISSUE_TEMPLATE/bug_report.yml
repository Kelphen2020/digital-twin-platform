name: 🐛 Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue，避免重复。
        **安全问题请改用 [私密报告](https://github.com/)，不要在这里公开。**
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. make dev-api && make dev-web
        2. 用 admin 登录
        3. 打开「租户」页签点击「导出」
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 后端 API（services/api）
        - Web 前端（apps/web）
        - 模拟器 / 脚本（services/simulator、scripts）
        - 部署 / 可观测性（deploy）
        - 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志、错误信息或截图（可拖拽上传）
