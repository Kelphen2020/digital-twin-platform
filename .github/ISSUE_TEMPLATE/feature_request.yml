name: ✨ 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的具体场景是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它怎么工作？有无参考实现？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 后端 API（services/api）
        - Web 前端（apps/web）
        - 模拟器 / 脚本
        - 部署 / 可观测性
        - 文档
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
