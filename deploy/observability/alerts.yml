# Prometheus alert rules for the digital-twin platform (P9.0).
groups:
  - name: digital-twin
    rules:
      - alert: ApiDown
        expr: up{job="digital-twin-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "数字孪生 API 不可用"
          description: "Prometheus 连续 1 分钟无法抓取 API。"

      - alert: NoOnlineCameras
        expr: dsh_twin_cameras_online == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "无在线相机"
          description: "所有摄像机离线，检查接入层或网络。"

      - alert: WebSocketDrops
        expr: increase(dsh_twin_ws_dropped_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "WebSocket 出现丢弃帧"
          description: "客户端发送队列满，考虑调大 HUB_CLIENT_BUFFER 或降低 WS_TRACK_SAMPLE。"

      - alert: BusLagHigh
        expr: dsh_twin_bus_lag > 500
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "事件总线积压"
          description: "总线 lag 超过 500，检查消费者/通知链路。"

      - alert: NotificationFailures
        expr: increase(dsh_twin_notifications_total{result="failed"}[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Webhook 通知失败"
          description: "检查 webhook 地址与网络，查看 /api/notifications 投递日志。"

      - alert: IngestRateLimited
        expr: increase(dsh_twin_ingest_rejected_total[5m]) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "ingest 被限流"
          description: "INGEST_RATE_LIMIT 低于实际负载，评估扩容或调高阈值。"

      - alert: EscalationBurst
        expr: increase(dsh_twin_escalations_total[10m]) > 50
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "升级告警激增"
          description: "10 分钟内升级事件超过 50，检查现场或阈值配置。"

  # ---- P35: multi-tenant thresholds --------------------------------------
  - name: digital-twin-tenant
    rules:
      - alert: TenantQuotaExceeded
        expr: sum by (tenant) (increase(dsh_twin_tenant_quota_exceeded_total[10m])) > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "租户 {{ $labels.tenant }} 频繁触发配额"
          description: "10 分钟内配额拒绝超过 10 次（维度 {{ $labels.dimension }}），评估扩配额或限流。"
          runbook: "docs/OPERATIONS.md#tenant-quota"

      - alert: TenantNoOnlineCameras
        expr: dsh_twin_tenant_cameras_online == 0 and on(tenant) (dsh_twin_tenant_requests_total > 0)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "租户 {{ $labels.tenant }} 无在线相机"
          description: "该租户有请求但在线相机为 0，检查接入层/采集端。"
          runbook: "docs/OPERATIONS.md#tenant-cameras"

      - alert: TenantIngestSilent
        expr: (sum by (tenant) (increase(dsh_twin_tenant_requests_total[15m])) > 100) unless on(tenant) (sum by (tenant) (increase(dsh_twin_tenant_ingest_total[15m])) > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "租户 {{ $labels.tenant }} 15 分钟无 ingest"
          description: "有 API 请求但没有 ingest 数据，检查摄像头推流或 ingest 客户端。"
          runbook: "docs/OPERATIONS.md#tenant-ingest"

      - alert: TenantRequestSpike
        expr: sum by (tenant) (rate(dsh_twin_tenant_requests_total[5m])) > 200
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "租户 {{ $labels.tenant }} 请求突增"
          description: "租户 5 分钟平均请求速率超过 200/s，确认是否为压测或异常客户端。"
          runbook: "docs/OPERATIONS.md#tenant-load"
